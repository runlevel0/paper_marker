[project]
name = "paper-marker"
version = "0.1.0"
description = "Parallel scientific PDF to Markdown converter with CLI and MCP interfaces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.3",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "httpx>=0.27.0",
  "mcp>=1.9.0",
]

[project.optional-dependencies]
marker = [
  "marker-pdf",
]
mineru = [
  "magic-pdf[full]",
]
nougat = [
  "nougat-ocr",
]
fallback = [
  "markitdown",
]
llm = []
all = [
  "marker-pdf",
  "magic-pdf[full]",
  "nougat-ocr",
  "markitdown",
]

[project.scripts]
paper-marker = "paper_marker.cli:app"
paper-marker-mcp = "paper_marker.mcp.server:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "pytest-mock>=3.14.0",
  "ruff>=0.4.8",
]

[tool.pytest.ini_options]
pythonpath = [
  "src",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
