[project]
name = "paper-marker"
version = "0.1.0"
description = "Parallel scientific PDF to Markdown converter with CLI and MCP interfaces."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "Patrick Simon", email = "patrick.simon@bam.de" },
]
keywords = [
  "pdf",
  "markdown",
  "conversion",
  "scientific",
  "mcp",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12.3",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "httpx>=0.27.0",
  "mcp>=1.9.0",
]

[project.optional-dependencies]
marker = [
  "marker-pdf",
]
mineru = [
  "magic-pdf[full]",
]
nougat = [
  "nougat-ocr",
]
fallback = [
  "markitdown",
]
llm = []
all = [
  "marker-pdf",
  "magic-pdf[full]",
  "nougat-ocr",
  "markitdown",
]

[project.urls]
Homepage = "https://github.com/runlevel0/paper_marker"
Documentation = "https://github.com/runlevel0/paper_marker#readme"
Repository = "https://github.com/runlevel0/paper_marker"
Issues = "https://github.com/runlevel0/paper_marker/issues"

[project.scripts]
paper-marker = "paper_marker.cli:app"
paper-marker-mcp = "paper_marker.mcp.server:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "ruff>=0.4.8",
]

[tool.pytest.ini_options]
pythonpath = [
  "src",
]
markers = [
  "integration: marks tests that require integration dependencies or local fixtures",
  "mcp: marks MCP protocol and server integration tests",
  "agent_style: marks deterministic agent-style MCP behavior tests",
]
addopts = [
  "--cov=paper_marker.routes",
  "--cov=paper_marker.synthesis",
  "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
include = [
  "src/paper_marker/routes/*",
  "src/paper_marker/synthesis/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/migrate_ledger_to_github.py" = ["E501"]
