name: MCP Tests

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tier-a-smoke-and-contracts:
    if: github.event_name != 'schedule'
    name: Tier A MCP smoke + contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev --extra llm

      - name: MCP smoke check
        run: uv run python scripts/mcp_smoke_check.py

      - name: MCP contract tests
        run: uv run pytest -q tests/integration/test_mcp_contracts.py -m "integration and mcp"

  tier-b-agent-style-nightly:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Tier B MCP agent-style tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --group dev --extra llm

      - name: MCP agent-style behavior tests
        run: uv run pytest -q tests/integration/test_mcp_agent_style_flows.py -m "integration and mcp and agent_style"

